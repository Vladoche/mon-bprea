name: Publier le site BPREA

on:
  workflow_dispatch:
    inputs:
      publish_auth_production:
        description: "Accord explicite : publier le frontend avec Auth PROD"
        type: boolean
        required: true
        default: false
      approved_notice_sha256:
        description: "SHA-256 LF de la notice finale approuvée (voir la PR)"
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Vérifier la décision et la branche de publication
        env:
          PUBLICATION_APPROVED: ${{ inputs.publish_auth_production }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$PUBLICATION_APPROVED" = true
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Installer Node.js pour vérifier la notice
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Vérifier le rendu exact de la notice
        run: node scripts/build-privacy-notice.mjs --check
      - name: Valider les paramètres publics et Auth PROD en lecture seule
        env:
          PAGES_SUPABASE_PROD_URL: ${{ vars.PAGES_SUPABASE_PROD_URL }}
          PAGES_SUPABASE_PROD_PUBLISHABLE_KEY: ${{ vars.PAGES_SUPABASE_PROD_PUBLISHABLE_KEY }}
          APPROVED_NOTICE_SHA256: ${{ inputs.approved_notice_sha256 }}
        run: >-
          python3 scripts/pages_release.py
          --output "$RUNNER_TEMP/auth-config.production.json"
          --approved-notice-sha256 "$APPROVED_NOTICE_SHA256"
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v6
      - name: Préparer les fichiers publics
        run: >-
          python3 scripts/prepare-pages.py --production
          --auth-config "$RUNNER_TEMP/auth-config.production.json"
          --version "$GITHUB_SHA" --output site-public
      - name: Déposer les fichiers du site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-public
          include-hidden-files: true
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v5
