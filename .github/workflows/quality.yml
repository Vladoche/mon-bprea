name: Qualité

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-integration:
    name: unit-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les tests unitaires et d’intégration
        run: npm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON: python3
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Vérifier les parcours navigateur
        run: npm run test:e2e
      - name: Conserver les traces et captures en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
