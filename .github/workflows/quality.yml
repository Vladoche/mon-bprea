name: Qualité

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-integration:
    name: unit-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les tests unitaires et d’intégration
        run: npm test
      - name: Vérifier le SDK navigateur verrouillé
        run: |
          npm run build:auth-sdk
          git diff --exit-code -- assets/vendor/supabase.js
      - name: Vérifier le rendu de la notice publique
        run: node scripts/build-privacy-notice.mjs --check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON: python3
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Installer Chromium
        run: node scripts/install-chromium.mjs
      - name: Vérifier les parcours navigateur
        run: npm run test:e2e
      - name: Conserver les captures pour validation visuelle et les traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-review-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  ui-performance:
    name: ui-performance-lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer les deux versions à comparer
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Installer Chromium verrouillé
        run: node scripts/install-chromium.mjs
      - name: Préparer la référence publique de main
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .tmp/ui-2027-foundations/baseline
          git archive "$BASE_SHA" assets documents ':(top,glob)*.html' | tar -xf - -C .tmp/ui-2027-foundations/baseline
      - name: Comparer les mesures de laboratoire
        run: |
          node scripts/measure-ui-foundations.mjs
          for page in mes-cours s-exercer outils; do
            node scripts/measure-ui-foundations.mjs --page "$page.html" --output ".tmp/ui-2027-foundations/performance-$page.json"
          done
          for id in uc3 uc1; do
            node scripts/measure-ui-foundations.mjs --page "uc.html?id=$id" --output ".tmp/ui-2027-foundations/performance-$id.json"
          done
          for id in matiere-organique rapport-cn; do
            node scripts/measure-ui-foundations.mjs --page "cours.html?id=$id" --output ".tmp/ui-2027-foundations/performance-$id.json"
          done
          node scripts/measure-ui-foundations.mjs --page 'exercices.html?id=matiere-organique' --baseline-ref '${{ github.event.pull_request.base.sha }}' --output .tmp/ui-2027-foundations/performance-quiz.json
          node scripts/measure-ui-foundations.mjs --page 'drill.html?unit=uc3&week=2026-W47' --baseline-ref '${{ github.event.pull_request.base.sha }}' --output .tmp/ui-2027-foundations/performance-drill.json
          node scripts/measure-ui-foundations.mjs --page 'tableau-de-bord.html?period=all' --baseline-ref '${{ github.event.pull_request.base.sha }}' --output .tmp/ui-2027-foundations/performance-dashboard.json
      - name: Conserver mesures brutes, médianes et budgets diagnostiques
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-performance-lab-${{ github.run_id }}
          path: |
            .tmp/ui-2027-foundations/performance*.json
            .tmp/ui-2027-foundations/quiz-review/
            .tmp/ui-2027-foundations/drill-review/
            .tmp/ui-2027-foundations/dashboard-review/
          retention-days: 14
          if-no-files-found: ignore
